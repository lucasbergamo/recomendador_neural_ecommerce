name: recomendador

services:
  mlflow:
    container_name: recomendador-mlflow
    image: ghcr.io/mlflow/mlflow:v3.13.0
    working_dir: /mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:///mlflow.db
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
      --allowed-hosts "*"
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  data-pipeline:
    container_name: recomendador-data-pipeline
    build:
      context: .
      target: runtime
    volumes:
      - ./data:/app/data
    command: ["python", "-m", "src.data.pipeline"]

  train-baselines:
    container_name: recomendador-train-baselines
    build:
      context: .
      target: runtime
    user: "${CURRENT_UID}:${CURRENT_GID}"
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_EXPERIMENT_NAME=recommendation-system
      - SEED=42
      - GIT_PYTHON_REFRESH=quiet
      - LOGNAME=appuser
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./metrics:/app/metrics
    command: ["python", "-m", "src.training.train_baselines"]
    profiles:
      - training

  train-model:
    container_name: recomendador-train-model
    build:
      context: .
      target: runtime
    user: "${CURRENT_UID}:${CURRENT_GID}"
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_EXPERIMENT_NAME=recommendation-system
      - SEED=42
      - GIT_PYTHON_REFRESH=quiet
      - LOGNAME=appuser
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./metrics:/app/metrics
    command: ["python", "-m", "src.training.trainer"]
    profiles:
      - training

  evaluate:
    container_name: recomendador-evaluate
    build:
      context: .
      target: runtime
    user: "${CURRENT_UID}:${CURRENT_GID}"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./metrics:/app/metrics
    command: ["python", "-m", "src.evaluation.metrics"]
    profiles:
      - training

  register:
    container_name: recomendador-register
    build:
      context: .
      target: runtime
    user: "${CURRENT_UID}:${CURRENT_GID}"
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_EXPERIMENT_NAME=recommendation-system
      - SEED=42
      - GIT_PYTHON_REFRESH=quiet
      - LOGNAME=appuser
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    command: ["python", "-m", "scripts.register_model"]
    profiles:
      - training

  ci:
    container_name: recomendador-ci
    build:
      context: .
      target: ci
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./metrics:/app/metrics
    profiles:
      - ci

volumes:
  mlflow_data:
