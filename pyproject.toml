[tool.poetry]
name = "recomendador-neural-ecommerce"
version = "0.1.0"
description = "Sistema de recomendação neural (NCF/MLP) para e-commerce com PyTorch, DVC e MLflow"
authors = ["Lucas Bergamo <lucascbergamo@gmail.com>"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
torch = ">=2.2"
scikit-learn = ">=1.5"
mlflow = ">=2.15"
pandas = ">=2.2"
numpy = ">=1.26"
pydantic-settings = ">=2.4"
structlog = ">=24.4"
requests = ">=2.32"
fastapi = ">=0.115"
uvicorn = { extras = ["standard"], version = ">=0.32" }

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3"
pytest-cov = ">=5.0"
httpx2 = ">=0.1"
ruff = ">=0.7"
ipykernel = ">=6.29"
matplotlib = ">=3.9"
seaborn = ">=0.13"
pre-commit = ">=3.8"
dvc = "^3.67.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = ["N803", "N806"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
